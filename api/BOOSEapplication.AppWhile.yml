  summary: >-
    Implements the WHILE control‑flow command for the BOOSE scripting engine.

    A WHILE command evaluates a comparison expression and either:

    <ul><li>enters the loop body if the condition is true</li><li>skips forward to the matching END WHILE if the condition is false</li></ul>
