  summary: Executes a sequence of commands in order, with support for modifying the execution flow.
  remarks: >-
    The method processes commands sequentially from the beginning of the list. If a
        command modifies  the execution flow by setting <code>nextIndex</code> to a non-negative value, the method jumps
        to the  specified index in the command list. Otherwise, it proceeds to the next command in
        sequence.
