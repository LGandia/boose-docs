  assemblies:
  - BOOSEapplication
  namespace: BOOSEapplication
  summary: Retrieves the value of a variable by its name.
  remarks: >-
    This method first attempts to retrieve the variable from the local scope of the
        current call stack frame.  If the variable is not found in the local scope, it falls back to retrieving the
        variable from the base context.
  example: []
  syntax:
    content: public Evaluation GetVariable(string name)
    parameters:
    - id: name
      type: System.String
      description: The name of the variable to retrieve. This parameter cannot be <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> or empty.
    return:
      type: BOOSE.Evaluation
      description: >-
        An <xref href="BOOSE.Evaluation" data-throw-if-not-resolved="false"></xref> object representing the value of the variable if it exists in the current call
            stack frame;  otherwise, the value of the variable from the base context.
    content.vb: Public Function GetVariable(name As String) As Evaluation
