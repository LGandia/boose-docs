  assemblies:
  - BOOSEapplication
  namespace: BOOSEapplication
  summary: >-
    Represents an application-specific stored program that extends the functionality of a base <xref href="BOOSE.StoredProgram" data-throw-if-not-resolved="false"></xref>. This class manages a collection of commands, methods, and a call stack to support

    program execution and method invocation.
  remarks: >-
    This class provides additional functionality for managing commands and methods, including the
        ability to add commands to the main program or to the body of a method, jump to specific execution points, and
        retrieve variables from the current call stack. It also integrates with an <xref href="BOOSE.ICanvas" data-throw-if-not-resolved="false"></xref> for graphical
        operations.
  example: []
  syntax:
    content: 'public class AppStoredProgram : StoredProgram, IList, ICollection, IEnumerable, ICloneable, IStoredProgram'
    content.vb: Public Class AppStoredProgram Inherits StoredProgram Implements IList, ICollection, IEnumerable, ICloneable, IStoredProgram
