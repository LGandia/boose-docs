  assemblies:
  - BOOSEapplication
  namespace: BOOSEapplication
  summary: >-
    Adds the specified command to the current method's body or to the general command list if no current method

    is set.
  remarks: >-
    If a current method is active, the command is added to its body. Otherwise, the
        command is added to a general list of commands. Ensure that <code class="paramref">command</code> is not <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> to avoid unexpected behavior.
  example: []
