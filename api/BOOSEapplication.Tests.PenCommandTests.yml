  namespace: BOOSEapplication.Tests
  summary: >-
    Unit tests for the <xref href="BOOSEapplication.PenCommand" data-throw-if-not-resolved="false"></xref> class.

    These tests verify that the command executes safely under a variety

    of parameter conditions, without throwing exceptions.


    Because <xref href="BOOSEapplication.AppCanvas" data-throw-if-not-resolved="false"></xref> cannot be mocked or inspected safely,

    these tests focus solely on ensuring that <xref href="BOOSEapplication.PenCommand" data-throw-if-not-resolved="false"></xref>

    accepts parameters, resolves variables and expressions, and executes

    without runtime errors.
