  summary: >-
    Represents a command that draws a rectangle on the canvas.

    The rectangle is always drawn unfilled.

    Inherits from <xref href="BOOSEapplication.AppCommandTwoParameters" data-throw-if-not-resolved="false"></xref> to support

    two parameters representing width and height.
