  assemblies:
  - BOOSEapplication
  namespace: BOOSEapplication
  summary: >-
    Executes the method call by:

    <ol><li>Locating the method definition.</li><li>Evaluating argument expressions.</li><li>Binding arguments to parameters in a new call frame.</li><li>Executing each command in the method body.</li><li>Copying the return value back to the global variable table.</li></ol>
  example: []
