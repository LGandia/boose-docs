  assemblies:
  - BOOSEapplication
  namespace: BOOSEapplication
  summary: >-
    Represents a method invocation command within the BOOSE application.

    <p>

    <xref href="BOOSEapplication.AppCall" data-throw-if-not-resolved="false"></xref> locates a method by name, evaluates its argument

    expressions, binds them to the method's parameters, executes the method body

    inside a new call frame, and finally stores the return value in the global

    variable table.

    </p>
  example: []
  syntax:
