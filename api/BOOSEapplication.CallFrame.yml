  namespace: BOOSEapplication
  summary: >-
    Represents a single stack frame used during a method call in the BOOSE runtime.

    A CallFrame stores:

    <ul><li>Local variables belonging to the method</li><li>The return address where execution should resume</li><li>The name of the return variable (usually the method name)</li></ul>
