  assemblies:
  - BOOSEapplication
  namespace: BOOSEapplication
  summary: Represents a two-dimensional array that can store either integer or real (double) values.
  remarks: >-
    The type of the array (integer or real) is determined during initialization. The array
        supports operations to get and set values at specific row and column indices, as well as metadata about its
        dimensions and type. The array must be initialized and compiled before it can be used.
  example: []
  syntax:
    content: 'public class AppArray : AppEvaluation, IEvaluation, ICommand'
    content.vb: Public Class AppArray Inherits AppEvaluation Implements IEvaluation, ICommand
