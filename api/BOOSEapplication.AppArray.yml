  namespace: BOOSEapplication
  summary: Configures the array declaration by parsing the provided parameters.
  remarks: >-
    The <code class="paramref">parameters</code> string must specify the array type (e.g., "int" or
        "real"),  the variable name, and the size. An optional second dimension can be included, separated by a
        comma.
  example: []
  syntax:
    content: public override void Set(StoredProgram program, string parameters)
    parameters:
    - id: program
      type: BOOSE.StoredProgram
      description: The <xref href="BOOSE.StoredProgram" data-throw-if-not-resolved="false"></xref> instance associated with this array declaration.
    - id: parameters
      type: System.String
      description: >-
        A string containing the array declaration parameters in the format:  "array &lt;type&gt; &lt;name&gt;
            &lt;size&gt;[,&lt;dim&gt;]".
