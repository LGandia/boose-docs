  assemblies:
  - BOOSEapplication
  namespace: BOOSEapplication
  summary: >-
    Represents the terminating command for structured control blocks

    such as IF, WHILE, FOR, and METHOD within the BOOSE scripting system.


    <p>

    <xref href="BOOSEapplication.AppEnd" data-throw-if-not-resolved="false"></xref> is responsible for resolving block termination

    and determining whether execution should continue normally or jump

    back to the start of a loop construct.

    </p>


    <p>

    The behaviour of this command depends on the <xref href="BOOSEapplication.AppEnd.Type" data-throw-if-not-resolved="false"></xref> value

    assigned during <xref href="BOOSEapplication.AppEnd.Set(BOOSE.StoredProgram%2cSystem.String)" data-throw-if-not-resolved="false"></xref>:

    <ul><li><code>if</code> → no action; control simply exits the IF block.</li><li><code>while</code> → jumps back to the matching WHILE if the loop condition was true.</li><li><code>for</code> → jumps back to the matching FOR if the loop condition was true.</li><li><code>method</code> → no-op under the direct-call execution model.</li></ul>

    </p>
  example: []
  syntax:
    content: 'public class AppEnd : ICommand'
    content.vb: Public Class AppEnd Implements ICommand
