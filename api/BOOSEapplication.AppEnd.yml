    path: ../BOOSEapplication/AppEnd.cs
    startLine: 75
  assemblies:
  - BOOSEapplication
  namespace: BOOSEapplication
  summary: >-
    Executes the END command, resolving control flow based on the block type.


    <p>

    For loop constructs (WHILE and FOR), this method scans backward through

    the program's command list to locate the matching block header. Nested

    loops are supported through depth tracking.

    </p>


    <p>

    If the loop's last evaluated condition was true, execution jumps back

    to the start of the loop. Otherwise, control exits the loop normally.

    </p>
  example: []
  syntax:
    content: public void Execute()
    content.vb: Public Sub Execute()
  overload: BOOSEapplication.AppEnd.Execute*
  implements:
  - BOOSE.ICommand.Execute
