  assemblies:
  - BOOSEapplication
  namespace: BOOSEapplication
  summary: >-
    Represents an assignment command that evaluates an arithmetic expression

    and stores the result in a BOOSE variable.
  remarks: >-
    <p>

    The <xref href="BOOSEapplication.AppAssign" data-throw-if-not-resolved="false"></xref> command supports simple arithmetic expressions

    involving addition, subtraction, multiplication, and division.

    </p>

    <p>

    Variables referenced in the expression are resolved through the

    <xref href="BOOSEapplication.AppStoredProgram" data-throw-if-not-resolved="false"></xref> symbol table. Any errors during evaluation

    are caught and reported through <xref href="BOOSEapplication.ErrorReport" data-throw-if-not-resolved="false"></xref>.

    </p>
  example: []
  syntax:
    content: 'public class AppAssign : ICommand'
    content.vb: Public Class AppAssign Implements ICommand
