  assemblies:
  - BOOSEapplication
  namespace: BOOSEapplication
  summary: >-
    Implements the IF conditional command for the BOOSE scripting system.

    <p>

    AppIf evaluates a comparison expression and conditionally executes or

    skips the associated IF block. When the condition is false, control

    flow jumps to the matching ELSE or END IF command.

    </p>
  example: []
  syntax:
    content: 'public class AppIf : ICommand'
    content.vb: Public Class AppIf Implements ICommand
