    id: ParseProgram
    path: ../BOOSEapplication/AppParser.cs
    startLine: 311
  assemblies:
  - BOOSEapplication
  namespace: BOOSEapplication
  summary: >-
    Parses an entire script program consisting of multiple lines of text.

    <p>

    This method performs the following steps:

    <ol><li>Resets the program state.</li><li>Splits the input text into individual lines.</li><li>Parses each line into an <xref href="BOOSE.ICommand" data-throw-if-not-resolved="false"></xref> using <xref href="BOOSEapplication.AppParser.ParseCommand(System.String)" data-throw-if-not-resolved="false"></xref>.</li><li>

    Immediately compiles and executes declarations (int, real, array, peek, poke).

    </li><li>

    Adds all other commands to the program's command list.

    </li><li>

    Performs a final compile pass on all stored commands.

    </li></ol>

    </p>
  example: []
  syntax:
    content: public void ParseProgram(string programText)
    parameters:
    - id: programText
      type: System.String
      description: The full script text to parse and load into the program.
    content.vb: Public Sub ParseProgram(programText As String)
