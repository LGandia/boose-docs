  namespace: BOOSEapplication
  summary: >-
    Parses script lines into executable BOOSE <xref href="BOOSE.ICommand" data-throw-if-not-resolved="false"></xref> objects.

    <p>

    The <xref href="BOOSEapplication.AppParser" data-throw-if-not-resolved="false"></xref> is responsible for:

    <ul><li>Normalizing whitespace and removing invisible characters</li><li>Detecting control-flow constructs (IF, WHILE, FOR, METHOD)</li><li>Creating commands via an <xref href="BOOSE.ICommandFactory" data-throw-if-not-resolved="false"></xref></li><li>Assigning parameters and expressions to commands</li><li>Updating method definitions inside <xref href="BOOSEapplication.AppStoredProgram" data-throw-if-not-resolved="false"></xref></li></ul>

    </p>
